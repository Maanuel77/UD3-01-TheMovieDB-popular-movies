<div class="container my-4">
  <h1 class="mb-4">Películas populares</h1>

  @if (error()) {
    <div class="alert alert-danger">No se han podido cargar las películas. Revisa la API Key.</div>
  }

  <div class="row g-4">
    @for (movie of movies(); track movie.id) {
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm">
          <img [src]="poster(movie)" class="card-img-top" [alt]="movie.title">
          <span class="nota badge bg-warning text-dark">★ {{ movie.vote_average | number: '1.1-1' }}</span>
          <div class="card-body">
            <h6 class="card-title mb-1">{{ movie.title }}</h6>
            <small class="text-muted">{{ movie.release_date | date: 'dd/MM/yyyy' }}</small>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="d-flex justify-content-center align-items-center gap-3 my-4">
    <button class="btn btn-outline-light" [disabled]="page() === 1" (click)="cambiarPagina(-1)">Anterior</button>
    <span>Página {{ page() }} de {{ totalPages() }}</span>
    <button class="btn btn-outline-light" [disabled]="page() >= totalPages()" (click)="cambiarPagina(1)">Siguiente</button>
  </div>
</div>
